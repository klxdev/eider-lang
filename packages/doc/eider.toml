[package]
name = "doc"
version = "0.4.0"
eider = "0.4"
main = "main.ei"
description = "eider-doc: documentation sites from Markdown pages and `eiderc doc --json`, and doc tests"

# the pinned releases of eider-json and eider-markdown (vendor.lock), fetched into .vendor/
# by scripts/vendor.sh (scripts/docs.sh does it); both pure: granted nothing
[deps.json]
path = "../../.vendor/json"

[deps.markdown]
path = "../../.vendor/markdown"
