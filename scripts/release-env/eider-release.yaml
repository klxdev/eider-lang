# The Eider verify and release environment as a hatchd image (the same as Containerfile, which stays the podman/docker recipe;
# the package list is packages.txt in this directory, shared with it: check-sync.sh checks the two agree):
#   hatchd image build scripts/release-env/eider-release.yaml --name eider-release
# then scripts/release-env/vm-run.sh (README.md). Fedora 44, because Fedora 45's glibc breaks ThreadSanitizer's longjmp.
from: fedora-44        # hatchd image pull docker.io/library/fedora:44 --name fedora-44
size: 14G

copy:
  - from: packages.txt
    to: /var/tmp/packages.txt

commands:
  - dnf -y --setopt=install_weak_deps=False install $(cat /var/tmp/packages.txt)
  - dnf clean all
  - mkdir -p /opt/musl-sysroot/usr && ln -s /usr/x86_64-linux-musl/include /opt/musl-sysroot/usr/include && ln -s /usr/x86_64-linux-musl/lib64 /opt/musl-sysroot/usr/lib
  - curl -fSL --retry 3 -o /var/tmp/lean.tar.zst https://github.com/leanprover/lean4/releases/download/v4.36.0/lean-4.36.0-linux.tar.zst
  - echo "2b7ab1ed8b92d2e6abfaf41344823b510064dbc9c0260cac73eb496ab2dea6eb  /var/tmp/lean.tar.zst" | sha256sum -c -
  - mkdir -p /opt/lean && tar --zstd -xf /var/tmp/lean.tar.zst -C /opt/lean --strip-components=1 && rm /var/tmp/lean.tar.zst
  - ln -s /opt/lean/bin/lean /usr/local/bin/lean && ln -s /opt/lean/bin/lake /usr/local/bin/lake
  # (no `lean --version` here: the build VM has too little memory to start Lean; vm-run.sh's first run shows it)
