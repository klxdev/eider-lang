[package]
name = "app"
version = "0.1.0"
main = "main.ei"
eider = "0.1"

[deps.geo]
path = "../geo"

[deps.shapes]
path = "../shapes"

# git dependencies: net is vendored (.vendor/net), cache comes from the store
# (EIDER_HOME=compiler/tests/pkgs/home)
[deps.net]
git = "file:///nonexistent/net"
version = "1.0.0"

[deps.cache]
git = "file:///nonexistent/cache"
version = "2.0.0"

# locked, but its directory is gone
[deps.gone]
path = "../gone"

# declared after the last `eider-pkg fetch`: not in eider.lock
[deps.ghost]
path = "../ghost"

# capabilities per package (docs/compiler.md, "C8.5"): files uses fs and io and is granted
# nothing (grants_fs.ei: E0204); cffi has an extern and ublock an `unsafe` block, both
# granted ffi (grants_ok.ei); wrap is granted fs, but its own grant to files is empty
# (grants_chain.ei)
[deps.files]
path = "../files"

[deps.cffi]
path = "../cffi"
uses = ["ffi"]

[deps.ublock]
path = "../ublock"
uses = ["ffi"]

[deps.wrap]
path = "../wrap"
uses = ["fs"]
